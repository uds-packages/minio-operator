# yaml-language-server: $schema=https://raw.githubusercontent.com/defenseunicorns/uds-cli/main/tasks.schema.json

tasks:
  - name: stage-test-package
    description: Stage the built package at the path used by the Next test bundle
    actions:
      - cmd: |
          VERSION=$(./zarf tools yq -r '.metadata.version' zarf.yaml)
          NAME=$(./zarf tools yq -r '.metadata.name' zarf.yaml)
          cp "zarf-package-${NAME}-${UDS_ARCH}-${VERSION}-${FLAVOR}.tar.zst" \
             "zarf-package-${NAME}-${UDS_ARCH}-dev.tar.zst"
